<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>英雄联盟 语音包切换器 · v2</title>
<style>
/* ===== 配色完全沿用原版: 浅蓝白底 + 蓝色主色 + 白色毛玻璃 ===== */
:root{
  --bg:#eef4fc;
  --glass:rgba(255,255,255,.78);
  --line:rgba(203,213,225,.62);
  --line-strong:rgba(148,163,184,.55);
  --blue:#2563eb; --blue-dark:#1d4ed8; --blue-soft:rgba(37,99,235,.09);
  --text:#334155; --strong:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --ok:#10b981; --r:14px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 12px 30px -20px rgba(37,99,235,.40),inset 0 1px 0 rgba(255,255,255,.95);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"SongGuHeiYuan","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.b1{width:420px;height:420px;top:-140px;left:-90px;background:rgba(59,130,246,.17)}
.b2{width:360px;height:360px;bottom:-160px;right:-60px;background:rgba(125,211,252,.20)}
.b3{width:300px;height:300px;top:40%;left:45%;background:rgba(199,210,254,.20)}

.app{position:relative;z-index:1;height:100%;max-width:800px;margin:0 auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.95);border-bottom-color:var(--line);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}

/* ---------- 顶部: 品牌 + 区服 ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,#60a5fa,#2563eb);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(37,99,235,.35)}
.hdr h1{font-size:14px;font-weight:700;color:var(--strong);letter-spacing:.2px}
.hdr .sub{font-size:11.5px;color:var(--faint);margin-left:2px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.region{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.7);font-size:12px;color:var(--muted)}
.region i{width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* ---------- 路径条 ---------- */
.path{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px}
.field{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border-radius:10px;background:rgba(255,255,255,.82);border:1px solid var(--line)}
.field svg{width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.8}
.field span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--text);font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(29,78,216,.25),0 8px 18px -10px rgba(37,99,235,.7)}

/* ---------- 主区: 左右两栏 ---------- */
.main{flex:1;display:grid;grid-template-columns:1.28fr .92fr;gap:11px;min-height:0}
.pane{padding:14px 15px;display:flex;flex-direction:column;min-height:0}
.pane-h{display:flex;align-items:center;gap:7px;margin-bottom:11px}
.pane-h b{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.pane-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* 语音包选择 */
.langbig{display:flex;align-items:center;gap:10px;height:46px;padding:0 13px;border-radius:11px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.langbig .flag{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;background:var(--blue-soft);color:var(--blue);font-weight:700}
.langbig .nm{font-size:14.5px;font-weight:600;color:var(--strong)}
.langbig .tag{margin-left:auto;font-size:11px;color:var(--blue);background:var(--blue-soft);border:1px solid rgba(37,99,235,.18);border-radius:999px;padding:2px 8px}
.langbig .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--faint)}

.sublinks{display:flex;gap:8px;margin-top:9px}
.sublinks .btn{flex:1;height:32px;font-size:12px}

/* 勾选项 */
.opts{margin-top:13px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:9px;height:36px;padding:0 11px;border-radius:10px;background:rgba(255,255,255,.66);border:1px solid var(--line);font-size:12.5px;color:var(--muted);cursor:pointer}
.opt .box{width:16px;height:16px;border-radius:5px;border:1.6px solid var(--line-strong);background:#fff;display:grid;place-items:center;flex:none}
.opt .box svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.opt.on{background:var(--blue-soft);border-color:rgba(37,99,235,.30);color:var(--blue-dark);font-weight:600}
.opt.on .box{background:var(--blue);border-color:var(--blue)}
.opt.on .box svg{opacity:1}
.opt .hint{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}
.opt.on .hint{color:rgba(29,78,216,.65)}

/* 状态列表 */
.slist{display:flex;flex-direction:column;gap:7px}
.srow{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.srow .dot{width:8px;height:8px;border-radius:50%;background:#21c07a;flex:none;box-shadow:0 0 0 3px rgba(33,192,122,.14)}
.srow .n{font-size:12.5px;color:var(--muted)}
.srow .v{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--strong)}
.srow.on{background:rgba(37,99,235,.07);border-color:rgba(37,99,235,.26)}
.srow.on .dot{background:#7c5cf0;box-shadow:0 0 0 3px rgba(124,92,240,.16)}
.srow.on .n{color:var(--blue-dark)}
.srow.on .v{color:var(--blue-dark)}
.scaption{margin-top:auto;font-size:11px;color:var(--faint);text-align:center;padding-top:8px}

/* ---------- 底部操作 ---------- */
.actions{display:grid;grid-template-columns:.8fr 1.2fr;gap:11px}
.actions .btn{height:46px;border-radius:13px;font-size:14px}
.actions .ghost{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--muted);font-weight:600}
.actions .go{background:var(--blue);border:1px solid var(--blue);color:#fff;font-weight:700;letter-spacing:.5px;box-shadow:0 2px 4px rgba(29,78,216,.22),0 14px 26px -14px rgba(37,99,235,.9)}

/* ---------- 状态栏 ---------- */
.foot{display:flex;align-items:center;gap:12px;padding:9px 14px}
.foot .st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.foot .st i{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.track{flex:1;height:5px;border-radius:999px;background:rgba(37,99,235,.10);overflow:hidden}
.track b{display:block;height:100%;width:62%;border-radius:999px;background:var(--blue)}
.saved{font-size:11.5px;color:var(--faint)}
</style>
</head>
<body>
<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

<div class="app">

  <!-- 顶部 -->
  <div class="card hdr">
    <div class="logo">L</div>
    <h1>语音包切换器</h1><span class="sub">League Voice</span>
    <div class="hdr-right"><span class="region"><i></i>国服</span></div>
  </div>

  <!-- 路径 -->
  <div class="card path">
    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>E:\WeGameApps\英雄联盟\LeagueClient</span>
    </div>
    <button class="btn">自动搜索</button>
    <button class="btn pri">确认</button>
  </div>

  <!-- 主区 -->
  <div class="main">
    <!-- 左: 语音包 -->
    <div class="card pane">
      <div class="pane-h"><b>语音包</b><span class="line"></span></div>
      <div class="langbig">
        <div class="flag">KR</div>
        <span class="nm">韩语语音包</span>
        <span class="tag">当前生效</span>
        <span class="caret"></span>
      </div>
      <div class="sublinks"><button class="btn">语音包选择</button><button class="btn">下载语音包</button></div>

      <div class="pane-h" style="margin-top:15px"><b>要替换的内容</b><span class="line"></span></div>
      <div class="opts">
        <label class="opt on"><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.4 4.7 9 10 3.4"/></svg></span>游戏内语音及播报员<span class="hint">对局中的播报</span></label>
        <label class="opt on"><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.4 4.7 9 10 3.4"/></svg></span>游戏内文字<span class="hint">界面与提示</span></label>
        <label class="opt on"><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.4 4.7 9 10 3.4"/></svg></span>客户端界面文字<span class="hint">跟随语音包语言</span></label>
        <label class="opt"><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.4 4.7 9 10 3.4"/></svg></span>对局前选人语音<span class="hint">需客户端运行</span></label>
      </div>
    </div>

    <!-- 右: 状态 -->
    <div class="card pane">
      <div class="pane-h"><b>当前状态</b><span class="line"></span></div>
      <div class="slist">
        <div class="srow on"><span class="dot"></span><span class="n">游戏内语音</span><span class="v">已开启</span></div>
        <div class="srow on"><span class="dot"></span><span class="n">游戏内文字</span><span class="v">已开启</span></div>
        <div class="srow on"><span class="dot"></span><span class="n">客户端文字</span><span class="v">已开启</span></div>
        <div class="srow"><span class="dot"></span><span class="n">选人语音</span><span class="v">原版</span></div>
      </div>
      <div class="scaption">绿 = 原版　紫 = 已开启</div>
    </div>
  </div>

  <!-- 操作 -->
  <div class="actions">
    <button class="btn ghost">恢复原版</button>
    <button class="btn go">开启语音包</button>
  </div>

  <!-- 状态栏 -->
  <div class="card foot">
    <span class="st"><i></i>就绪</span>
    <span class="track"><b></b></span>
    <span class="saved">配置已保存</span>
    <button class="btn" style="height:28px;padding:0 11px;font-size:12px">日志</button>
  </div>

</div>
</body>
</html>
