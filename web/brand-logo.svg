<svg xmlns="http://www.w3.org/2000/svg" width="894" height="168" viewBox="0 0 894 168" role="img" aria-label="LoLskins 稳定换肤">
  <title>LoLskins 稳定换肤</title>

  <!--
    不要背景色: 直接是深蓝文字, 贴在浅色毛玻璃卡片上最不突兀。
    字号按**显示尺寸**倒推: 界面里显示 208px 宽 => 缩放 0.233
      英文 LoLskins  50px -> 显示约 12px
      中文 稳定换肤  82px -> 显示约 19px
    两段用 textLength 锁宽(260 / 410), 换字体也不会重叠或跑版。
  -->
  <text x="80" y="116" fill="#1e3a8a"
        font-family="'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="50" font-weight="700"
        textLength="260" lengthAdjust="spacingAndGlyphs">LoLskins</text>

  <text x="384" y="116" fill="#1e3a8a"
        font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif"
        font-size="82" font-weight="700"
        textLength="410" lengthAdjust="spacingAndGlyphs">稳定换肤</text>
</svg>
