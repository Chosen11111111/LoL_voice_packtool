<svg xmlns="http://www.w3.org/2000/svg" width="790" height="59" viewBox="0 33 790 59" role="img" aria-label="LoLskins 稳定换肤">
  <title>LoLskins 稳定换肤</title>

  <!--
    viewBox 从 y=33（大写字母顶）到 y=92（笔画实际底边, 不含字体下伸空白）——**上下不留空白**,
    这样图片的底边就是文字的底线, 和旁边那排勾选胶囊的底边能真正对齐。
    尺寸按几何规则: 英文 74px(大写字高 0.72em=53px) = 中文 62px(汉字高 0.86em=53px)。
    界面里图片高 17px 时, 字高约 13px, 与胶囊里的文字差不多; 宽约 200px。
  -->
  <g fill="#2563eb">
    <text x="40" y="86" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke"
          font-family="'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="74" font-weight="800" letter-spacing="0.5">LoLskins</text>
    <text x="380" y="86"
          font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif"
          font-size="62" font-weight="700" letter-spacing="5">稳定换肤</text>
  </g>
</svg>
