<svg xmlns="http://www.w3.org/2000/svg" width="790" height="120" viewBox="0 0 790 120" role="img" aria-label="LoLskins 稳定换肤">
  <title>LoLskins 稳定换肤</title>

  <!--
    为什么这样定尺寸(显示宽度 208px, 缩放 0.263):
      英文 78px: 大写字母高约 0.72em -> 显示约 14.8px
      中文 66px: 汉字高约 0.86em   -> 显示约 14.9px
    两者**视觉等高**, 所以大小协调; 换字体也不会跑版(用 textLength 锁宽)。
    颜色取界面主色 #2563eb(浅蓝), 描边用深一点的蓝, 做出艺术字的层次。
  -->
  <g fill="#2563eb" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke"
     font-weight="900" text-anchor="start">
    <text x="60" y="84"
          font-family="'Segoe UI Black','Arial Black','Segoe UI',system-ui,-apple-system,sans-serif"
          font-size="78" letter-spacing="1"
          textLength="345" lengthAdjust="spacingAndGlyphs">LoLskins</text>
    <text x="445" y="84"
          font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif"
          font-size="66" letter-spacing="5"
          textLength="270" lengthAdjust="spacingAndGlyphs">稳定换肤</text>
  </g>
</svg>
