<svg xmlns="http://www.w3.org/2000/svg" width="790" height="120" viewBox="0 0 790 120" role="img" aria-label="LoLskins 稳定换肤">
  <title>LoLskins 稳定换肤</title>

  <!--
    尺寸规则(印刷业标准做法): **英文大写字母高 = 中文汉字高**。
      英文字体 74px -> 大写高约 0.72em = 53px
      中文字体 62px -> 汉字高约 0.86em = 53px      (0.86/0.72 ≈ 1.19, 所以中文号数要更小)
    显示宽度 208px、缩放 0.263 => 两者都约 14px 高, 视觉等重。
    (试过 78/66 会被看成"英文偏大", 62/68 会被看成"中文偏大", 这条几何规则最稳。)
    颜色取界面主色 #2563eb; 描边 #1d4ed8 做出艺术字层次。
  -->
  <g fill="#2563eb" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke">
    <text x="76" y="84"
          font-family="'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="74" font-weight="800" letter-spacing="0.5"
          textLength="330" lengthAdjust="spacingAndGlyphs">LoLskins</text>
    <text x="436" y="84"
          font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif"
          font-size="62" font-weight="700" letter-spacing="6"
          textLength="260" lengthAdjust="spacingAndGlyphs">稳定换肤</text>
  </g>
</svg>
