<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="168" viewBox="0 0 1000 168" role="img" aria-label="ChosenLoLskins 稳定换肤">
  <title>ChosenLoLskins 稳定换肤</title>

  <!-- 纯色底(不要渐变), 与界面同一个蓝 -->
  <rect x="0" y="0" width="1000" height="168" rx="30" fill="#2563eb"/>

  <!--
    字号是按**显示尺寸**倒推的: 界面里显示 208px 宽 => 缩放 0.208
      英文 64px -> 显示约 13px
      中文 76px -> 显示约 16px(比英文更大, 保证看得清)
    两段都用 textLength 锁宽, 换任何字体/机器都不会重叠或跑版。
  -->
  <text x="60" y="108" fill="#ffffff"
        font-family="'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="64" font-weight="700"
        textLength="560" lengthAdjust="spacingAndGlyphs">ChosenLoLskins</text>

  <text x="648" y="108" fill="#ffffff"
        font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif"
        font-size="76" font-weight="700"
        textLength="304" lengthAdjust="spacingAndGlyphs">稳定换肤</text>
</svg>
