<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>英雄联盟 语音包切换器</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<!-- 柔和蓝白环境底衬（供毛玻璃折射出通透质感，克制不花哨） -->
<div class="ambient-bg" aria-hidden="true">
  <span class="ambient-blob blob-1"></span>
  <span class="ambient-blob blob-2"></span>
  <span class="ambient-blob blob-3"></span>
</div>

<div class="layout">

  <!-- 第一排：路径栏 -->
  <section class="row-card glass">
    <div class="row-head">
      <span class="row-label">游戏路径</span>
      <!-- 选人台词播报: 触发方式 + 音量(右上角) -->
      <div class="hud" id="voiceHud">
        <button type="button" class="hud-pill" id="btnClientVoice" title="客户端自己念的原版台词（选人/禁用）">原版台词：读取中…</button>
        <button type="button" class="hud-icon" id="btnMuteToggle" title="本工具播报音量 静音 / 取消静音" aria-label="静音切换">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M4 9.5h3L11 6v12l-4-3.5H4z" fill="currentColor" />
            <path id="muteArc1" d="M14.4 9.2a4.2 4.2 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path id="muteArc2" d="M17 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path id="muteCross" d="M15 9.5l5 5M20 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
        <input type="range" class="hud-volume" id="volumeSlider" min="0" max="100" step="1" value="60" aria-label="播报音量" />
        <span class="hud-value" id="volumeValue">60%</span>
        <button type="button" class="hud-mini" id="btnAlignVolume" title="播报音量跟随客户端总音量">对齐</button>
        <label class="hud-delay" title="播报延迟：官方台词稍晚时用它对齐（0 = 立即播）">
          延迟
          <input type="number" id="delayInput" min="0" max="3000" step="50" value="1000" aria-label="播报延迟(毫秒)" />
          ms
        </label>
      </div>
    </div>
    <div class="control-bar">
      <div class="field-shell" id="pathFieldShell">
        <input
          type="text"
          id="leaguePathInput"
          placeholder="例如：D:\WeGameApps\英雄联盟\LeagueClient"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <button type="button" class="btn soft-btn" id="btnAutoSearchPath">自动搜索</button>
      <button type="button" class="btn primary" id="btnConfirmPath">确认</button>
      <button type="button" class="btn region-pill" id="btnServerRegion" data-region="cn">
        <span class="region-dot"></span>
        <span id="regionText">国服</span>
      </button>
    </div>
  </section>

  <!-- 第二排：语言包下拉栏 + 压缩包选择 + 三种勾选情况 -->
  <section class="row-card glass row-dropdown-section">
    <div class="row-head">
      <span class="row-label">语音包选择</span>
    </div>
    <div class="control-bar">
      <!-- 自定义毛玻璃下拉栏 -->
      <div class="custom-select" id="customLocaleSelect">
        <button type="button" class="select-trigger" id="selectTrigger" aria-expanded="false">
          <span class="select-label placeholder" id="selectLabel">未选中语音包</span>
          <span class="select-caret"></span>
        </button>
        <div class="select-menu hidden" id="selectMenu"></div>
        <select id="localeSelect" class="hidden">
          <option value="">未选中语音包</option>
        </select>
      </div>

      <input
        type="file"
        id="voicePackFileInput"
        class="hidden"
        accept=".zip,.7z,.rar,.tar,.gz"
      />
      <button type="button" class="btn soft-blue-btn" id="btnChooseLocale">语音包选择</button>
    </div>

    <!-- 三种情况：胶囊式舒适勾选框 -->
    <div class="check-subrow">
      <label class="check-pill">
        <input type="checkbox" id="modIngameVoice" checked />
        <span class="check-dot"></span>
        <span class="check-text">游戏内语音及播报员</span>
      </label>

      <label class="check-pill">
        <input type="checkbox" id="modIngameLang" checked />
        <span class="check-dot"></span>
        <span class="check-text">游戏内文字</span>
      </label>

      <label class="check-pill">
        <input type="checkbox" id="modLobbyVoice" checked />
        <span class="check-dot"></span>
        <span class="check-text">对局前选人语音</span>
      </label>
    </div>
  </section>

  <!-- 第三排：当前状态（三个状况） -->
  <section class="row-card glass status-section">
    <div class="row-head">
      <span class="row-label">当前状态</span>
    </div>
    <div class="status-three-grid">
      <div class="status-item" id="cardStatusVoice">
        <div class="status-item-top">
          <span class="status-name">游戏内语音及播报员</span>
          <span class="status-tag" id="tagStatusVoice">原版</span>
        </div>
        <strong class="status-badge" id="statusIngameVoice">读取中…</strong>
      </div>

      <div class="status-item" id="cardStatusLang">
        <div class="status-item-top">
          <span class="status-name">游戏内文字</span>
          <span class="status-tag" id="tagStatusLang">原版</span>
        </div>
        <strong class="status-badge" id="statusIngameLang">读取中…</strong>
      </div>

      <div class="status-item" id="cardStatusLobby">
        <div class="status-item-top">
          <span class="status-name">对局前选人语音</span>
          <span class="status-tag" id="tagStatusLobby">原版</span>
        </div>
        <strong class="status-badge" id="statusLobbyVoice">读取中…</strong>
      </div>
    </div>
    <!-- 上次"开启语音包"的记录: 重启后仍能看出当前生效的是什么 -->
    <div class="status-last-applied hidden" id="statusLastApplied"></div>
  </section>

  <!-- 第四排：恢复按钮和开启按钮 -->
  <section class="action-row">
    <button type="button" class="btn action-btn restore-btn glass" id="btnRestore">恢复原版</button>
    <button type="button" class="btn primary action-btn apply-btn" id="btnApply">开启语音包</button>
  </section>

  <!-- 第五排：状态 和 日志按钮 -->
  <footer class="row-card glass footer-row">
    <div class="footer-status">
      <div class="footer-status-top">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">就绪</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <span class="hud-value" id="configSaveStatus" role="status" aria-live="polite">配置读取中…</span>
    <button type="button" class="btn soft-btn log-btn" id="btnOpenLog">日志</button>
  </footer>

</div>

<!-- 多路径选择弹窗 -->
<div class="modal hidden" id="pathSelectModal">
  <div class="modal-box glass-modal">
    <div class="modal-head">
      <h3>检测到多个英雄联盟路径，请选择</h3>
      <button type="button" class="btn tiny soft-btn" id="btnClosePathSelect">关闭</button>
    </div>
    <p class="modal-tip">在电脑中搜索到以下多个游戏目录，点击对应项即可选用：</p>
    <div class="path-cand-list" id="pathCandidateList"></div>
  </div>
</div>

<!-- 日志弹窗 -->
<div class="modal hidden" id="logModal">
  <div class="modal-box glass-modal">
    <div class="modal-head">
      <h3>运行日志</h3>
      <div class="modal-actions">
        <button type="button" class="btn tiny soft-btn" id="btnClearLog">清空</button>
        <button type="button" class="btn tiny soft-btn" id="btnCloseLog">关闭</button>
      </div>
    </div>
    <div class="log-content" id="logBox">[就绪]</div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
